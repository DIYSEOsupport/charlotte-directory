<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Directory Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Oswald:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a1033;--purple:#7b3ff2;--yellow:#ffd23f;--cream:#fff6dc;--good:#1f8a3b;--bad:#e5322d;--teal:#0e95a8}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Oswald',Arial,sans-serif;font-size:17px;line-height:1.4}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-family:'Bangers',cursive;font-size:40px;letter-spacing:1px;margin:0 0 4px;color:var(--purple)}
.sub{margin:0 0 16px;font-size:15px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
button,a.btn{font:600 17px 'Oswald',Arial,sans-serif;border:3px solid var(--ink);border-radius:10px;padding:10px 18px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);text-decoration:none;color:var(--ink);background:var(--yellow)}
a.btn{background:var(--teal);color:#fff}
button:disabled{opacity:.6;cursor:wait}
.sum{font-family:'Bangers',cursive;font-size:28px;letter-spacing:1px;margin:0 0 10px}
.sum.good{color:var(--good)}.sum.bad{color:var(--bad)}
ul{list-style:none;margin:0;padding:0}
li{background:#fff;border:2px solid var(--ink);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;overflow-wrap:anywhere}
li .ic{flex:0 0 auto;width:26px;height:26px;border-radius:50%;color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center;font-size:15px}
li.ok .ic{background:var(--good)}li.no{border-color:var(--bad)}li.no .ic{background:var(--bad)}
li .sm{display:block;font-size:14px;opacity:.75}
.build{font-size:13px;opacity:.7;margin-top:14px}
.spin{display:inline-block;width:18px;height:18px;border:3px solid var(--ink);border-top-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Directory Check</h1>
  <p class="sub">Tests the sheet, emails and automatic jobs. Sends nothing and changes nothing.</p>
  <div class="btns">
    <button id="run">Run check again</button>
    <a class="btn" href="./">Directory</a>
  </div>
  <div id="out"></div>
</div>
<script>
var ENDPOINT='https://script.google.com/macros/s/AKfycbw3yK823DH4sQqc1nFkvPKMbAhq2-oa0jrXDS_af_bXADEdrayXn5_XUrvfQE5gSx7wJg/exec';
var out=document.getElementById('out'),btn=document.getElementById('run');
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function show(text){
  var lines=String(text).split('\n'),build='',sum='',items=[];
  lines.forEach(function(l){
    if(/^Build: /.test(l)){build=l;return;}
    var m=/^(OK|PROBLEM)\s+(.*)$/.exec(l);
    if(m){items.push({ok:m[1]==='OK',t:m[2],sub:[]});return;}
    if(l.trim()&&items.length&&/^\s/.test(l)){items[items.length-1].sub.push(l.trim());return;}
    if(l.trim())sum=l.trim();
  });
  if(!items.length){out.innerHTML='<p class="sum bad">Could not read the check.</p><p>'+esc(text)+'</p>';return;}
  var good=sum==='All good';
  out.innerHTML='<p class="sum '+(good?'good':'bad')+'">'+esc(sum)+'</p><ul>'+items.map(function(i){
    return '<li class="'+(i.ok?'ok':'no')+'"><span class="ic">'+(i.ok?'&#10003;':'!')+'</span><span>'+esc(i.t)+
      i.sub.map(function(s){return '<span class="sm">'+esc(s)+'</span>';}).join('')+'</span></li>';
  }).join('')+'</ul><p class="build">'+esc(build)+'</p>';
}
function run(){
  btn.disabled=true;out.innerHTML='<p><span class="spin"></span>Checking&hellip;</p>';
  var cb='chk'+Date.now(),s=document.createElement('script'),done=false;
  var t=setTimeout(function(){if(done)return;done=true;fail('No answer from the script. Try again in a minute.');},30000);
  window[cb]=function(text){if(done)return;done=true;clearTimeout(t);btn.disabled=false;show(text);cleanup();};
  function cleanup(){try{delete window[cb];}catch(e){window[cb]=undefined;}if(s.parentNode)s.parentNode.removeChild(s);}
  function fail(msg){btn.disabled=false;out.innerHTML='<p class="sum bad">Check did not run</p><p>'+esc(msg)+'</p>';cleanup();}
  s.onerror=function(){if(done)return;done=true;clearTimeout(t);fail('Could not reach the script. Is the new build deployed?');};
  s.src=ENDPOINT+'?check=1&callback='+cb+'&t='+Date.now();
  document.body.appendChild(s);
}
btn.onclick=run;run();
</script>
</body>
</html>
