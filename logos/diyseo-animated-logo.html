<meta charset="utf-8">

<title>DIYSEO Animated Logo</title>
<style>
  :root { --logo-width: min(92vw, 900px); --rotation-speed: 8s; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { min-height: 100vh; display: grid; place-items: center; background: transparent; }
  .diyseo-logo { width: var(--logo-width); display: flex; align-items: center; gap: 1.2%; }
  .diyseo-gear-window { flex: 0 0 30%; aspect-ratio: 280 / 275; display: grid; place-items: center; }
  .diyseo-gear { display: block; width: 100%; height: 100%; object-fit: contain;
    transform-origin: 50% 50%; animation: diyseo-clockwise var(--rotation-speed) linear infinite; }
  .diyseo-wordmark { display: block; flex: 1 1 auto; width: 0; height: auto; object-fit: contain; }
  @keyframes diyseo-clockwise { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .diyseo-gear { animation: none; } }
</style>
